<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Album Flow Visualizer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topnav">
  <h1>Album Flow Visualizer</h1>
  <a href="index.html" class="active">Home</a>
  <a href="add.html">曲を追加</a>
  <a href="overview.html">全体の流れ</a>
</header>
<main>
  <div class="panel">
    <h2>これは何？</h2>
    <p>アルバムの各曲に「静か」「轟音」「歌」のような要素タグを時間帯ごとに付け、アルバム全体の流れを帯グラフで可視化するツールです。</p>
    <ol>
      <li><a href="add.html">曲を追加</a>ページで、曲名・曲の長さを入力し、帯グラフ上をドラッグして要素タグと時間帯を登録します。</li>
      <li><a href="overview.html">全体の流れ</a>ページで、登録した曲を並べ替えながらアルバム全体の流れを帯グラフで確認します。</li>
    </ol>
    <p>データはこのブラウザ内（localStorage）に保存されます。</p>
  </div>
</main>
</body>
</html>
